[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinnery"
version = "0.1.0"
description = "Shared Flow protocol and governance core for CLI applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dagster = [
  "dagster>=1.8",
]
dev = [
  "pytest>=8.0.0",
  "dagster>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["tinnery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
