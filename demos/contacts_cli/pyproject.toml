[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contacts-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "tinnery",
]

[tool.uv.sources]
tinnery = { path = "../..", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
contacts-cli = "contacts_cli.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
